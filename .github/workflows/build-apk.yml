name: Build FireBrowser APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir buildsrc
          unzip -q FireBrowser-v1.0.0-Software-Upgrade-Ready.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/FireBrowser-v1.0.0
        run: gradle :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp buildsrc/FireBrowser-v1.0.0/app/build/outputs/apk/debug/app-debug.apk dist/FireBrowser-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireBrowser-v1.0.0
          path: dist/FireBrowser-v1.0.0.apk
