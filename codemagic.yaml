workflows:
  firebrowser:
    name: Build FireBrowser APK
    instance_type: linux_x2
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Extract project
        script: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q FireBrowser-v1.0.0-Software-Upgrade-Ready.zip -d buildsrc

      - name: Build APK
        script: |
          cd buildsrc/FireBrowser-v1.0.0
          gradle :app:assembleDebug

    artifacts:
      - buildsrc/FireBrowser-v1.0.0/app/build/outputs/apk/debug/app-debug.apk
